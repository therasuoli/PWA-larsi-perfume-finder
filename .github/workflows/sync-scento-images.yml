name: Refresh Scento image manifest

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to crawl (empty = all)'
        required: false
        default: ''
        type: string
      delay:
        description: 'Delay between requests (seconds)'
        required: false
        default: '1.5'
        type: string
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

concurrency:
  group: scento-image-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile scripts/sync_scento_images.py

      - name: Backup previous manifest
        run: |
          mkdir -p .ci-backup
          if [ -f data/perfume-images.json ]; then
            cp data/perfume-images.json .ci-backup/perfume-images.json
          fi

      - name: Sync Scento images
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          DELAY: ${{ github.event.inputs.delay || '1.5' }}
        run: |
          set -euo pipefail
          ARGS="--delay ${DELAY}"
          if [ -n "${MAX_PAGES}" ]; then
            ARGS="${ARGS} --max-pages ${MAX_PAGES}"
          fi
          echo "running: python scripts/sync_scento_images.py ${ARGS}"
          python scripts/sync_scento_images.py ${ARGS}

      - name: Validate manifest JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('data/perfume-images.json')
          if not p.exists():
              print('::error::manifest file missing')
              sys.exit(1)
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
          except Exception as e:
              print(f'::error::invalid JSON: {e}')
              sys.exit(1)
          images = data.get('images', data) if isinstance(data, dict) else data
          count = len(images) if hasattr(images, '__len__') else 0
          print(f'ok, entries={count}, size={p.stat().st_size} bytes')
          PY

      - name: Diff stats
        run: |
          if [ -f .ci-backup/perfume-images.json ]; then
            echo "### Manifest delta" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            git diff --stat -- data/perfume-images.json >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit & push
        run: |
          set -euo pipefail
          if git diff --quiet -- data/perfume-images.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/perfume-images.json
          git commit -m 'chore: refresh Scento image manifest'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
