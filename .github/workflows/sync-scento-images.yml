name: Refresh Scento image manifest
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/sync_scento_images.py --delay 1.5
      - name: Commit manifest
        run: |
          if ! git diff --quiet -- data/perfume-images.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/perfume-images.json
            git commit -m 'chore: refresh Scento image manifest'
            git push
          fi
