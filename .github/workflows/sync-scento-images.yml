name: Sync Scento perfume images
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 1 * *' # monthly, sequential low-rate crawl
permissions:
  contents: write
jobs:
  extract-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Extract product image URLs from Scento pages
        run: python scripts/sync_scento_images.py --delay 1.25
      - name: Commit updated image index
        run: |
          if git diff --quiet -- data/perfume-images.json; then
            echo "No image index changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/perfume-images.json
            git commit -m "chore: refresh Scento perfume image index"
            git push
          fi
