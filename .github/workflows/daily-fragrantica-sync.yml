# Larsi Perfume Finder — daily-fragrantica-sync.yml
#
# Daily automatic Fragrantica extractor with multi-source discovery.
#
# Every day at 03:00 UTC (06:30 Asia/Tehran) the workflow:
#   1. Discovers perfume URLs from MULTIPLE sources (all combinable):
#        --brands "Amouage,Dior,Chanel"            Brand pages
#        --urls "url1,url2"                          Explicit perfume URLs
#        --search "oud|male,rose|female"            Search by keyword + gender
#        --whats-new                                  Latest releases (~69 perfumes)
#        --country "France,Italy"                    Country pages
#        --designers-index                            ALL brands on Fragrantica
#   2. Fetches each perfume page with full Cloudflare-bypass headers (curl)
#   3. Extracts ALL fields with 100% coverage (12+ fields, both EN + FA)
#   4. Saves to data/fragrantica-extracted.json (committed to repo)
#
# Throttled to 4-8 seconds between requests. Resumable via progress file.
name: Daily Fragrantica sync

on:
  schedule:
    # 03:00 UTC daily = 06:30 Asia/Tehran (off-peak for both Fragrantica and our users)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Discovery source'
        required: true
        type: choice
        default: 'brands'
        options:
          - brands
          - whats-new
          - search
          - country
          - designers-index
      brands:
        description: 'Comma-separated brand slugs (when source=brands)'
        required: false
        default: 'Amouage,Dior,Chanel,Guerlain,Creed,Parfums-de-Marly,Frederic-Malle,Byredo'
      search_query:
        description: 'Search queries (when source=search). Format: "oud|male,rose|female"'
        required: false
        default: 'oud|male,rose|female,vanilla|unisex'
      countries:
        description: 'Countries (when source=country)'
        required: false
        default: 'France,Italy,USA'
      max_brands_from_index:
        description: 'Max brands (when source=designers-index, 0=all)'
        required: false
        default: '20'
      limit:
        description: 'Max perfumes to extract (0 = unlimited)'
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-fragrantica-sync.yml'
      - 'scripts/fragrantica-extract.mjs'
      - 'data/fragrantica-dictionary.mjs'

permissions:
  contents: write   # needed for git-auto-commit-action

concurrency:
  group: fragrantica-sync
  cancel-in-progress: false   # don't cancel mid-run; resume next day

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours max (Fragrantica throttling makes 1500 perfumes take ~3h)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Confirm curl is installed
        run: |
          curl --version | head -1
          echo "curl is required for Cloudflare bypass (Node fetch gets 403)"

      - name: Build extractor command from inputs
        id: cmd
        run: |
          SOURCE="${{ github.event.inputs.source || 'brands' }}"
          BRANDS="${{ github.event.inputs.brands || 'Amouage,Dior,Chanel,Guerlain,Creed,Parfums-de-Marly,Frederic-Malle,Byredo' }}"
          SEARCH="${{ github.event.inputs.search_query || '' }}"
          COUNTRIES="${{ github.event.inputs.countries || '' }}"
          MAX_BRANDS="${{ github.event.inputs.max_brands_from_index || '0' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"

          CMD="node scripts/fragrantica-extract.mjs --delay-min 5000 --delay-max 9000 --resume --limit $LIMIT"

          case "$SOURCE" in
            brands)
              CMD="$CMD --brands \"$BRANDS\""
              ;;
            whats-new)
              CMD="$CMD --whats-new"
              ;;
            search)
              CMD="$CMD --search \"$SEARCH\""
              ;;
            country)
              CMD="$CMD --country \"$COUNTRIES\""
              ;;
            designers-index)
              CMD="$CMD --designers-index --max-brands-from-index $MAX_BRANDS"
              ;;
          esac

          echo "command=$CMD" >> $GITHUB_OUTPUT
          echo "Will run: $CMD"

      - name: Run extractor
        run: ${{ steps.cmd.outputs.command }}

      - name: Show extraction summary
        run: |
          echo "### Fragrantica sync — ${{ github.event.inputs.source || 'brands' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/fragrantica-extracted.json ]; then
            COUNT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/fragrantica-extracted.json","utf8")).length)')
            echo "Total records: **$COUNT**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "First 3 records:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e 'const d=JSON.parse(require("fs").readFileSync("data/fragrantica-extracted.json","utf8")); console.log(JSON.stringify(d.slice(0,3).map(r=>({brand:r.brand,name:r.name,year:r.year,rating:r.rating,gender:r.gender,accords:(r.accords||[]).length})),null,2))' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/fragrantica-progress.json ]; then
            echo "Progress:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e 'const p=JSON.parse(require("fs").readFileSync("data/fragrantica-progress.json","utf8")); console.log(JSON.stringify({processed:p.processed.length,failed:p.failed.length},null,2))' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): Fragrantica sync (${{ github.event.inputs.source || 'daily' }}) — ${{ github.run_id }}'
          file_pattern: 'data/fragrantica-extracted.json data/fragrantica-progress.json'
          commit_user_name: 'fragrantica-bot'
          commit_user_email: 'fragrantica-bot@users.noreply.github.com'

      - name: Clean up cache (don't commit HTML cache files)
        run: |
          rm -rf data/.frag-cache
          echo "Cache cleaned — HTML files not committed to repo"
