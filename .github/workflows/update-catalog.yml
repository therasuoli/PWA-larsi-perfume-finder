name: Build and sync owner perfume catalogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/extra/*.json']

permissions:
  contents: write

concurrency:
  group: refresh-perfume-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build catalogue from owner-managed imports (no external sources)
        run: node scripts/build-data.mjs
      - name: Validate chunks and metadata
        run: node scripts/validate-data.mjs
      - name: Sync catalogue to Supabase (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-supabase.mjs
      - name: Commit updated data files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/perfumes.json data/perfumes-*.json data/manifest.json data/meta.json
          if git diff --cached --quiet; then echo 'Catalogue unchanged.'; else git commit -m 'chore(data): rebuild owner catalogue'; git pull --rebase origin "${GITHUB_REF_NAME}" && git push; fi
