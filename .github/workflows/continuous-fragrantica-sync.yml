# Larsi Perfume Finder — continuous-fragrantica-sync.yml
#
# 24/7 CONTINUOUS EXTRACTION — runs every hour, refreshes data incrementally.
#
# Schedule (3 tiers to balance coverage vs. resource usage):
#   - HOURLY (every hour, 24/7):
#       Source: --whats-new (latest ~69 releases)
#       Mode:   --resume --refresh-older-than 168h (re-fetch any record older than 7 days)
#       Runtime: ~10-15 minutes
#       Purpose: catch newly released perfumes + refresh stale ratings
#
#   - DAILY (03:00 UTC = 06:30 Asia/Tehran):
#       Source: --brands (8 luxury brands, ~1000 perfumes)
#       Mode:   --resume --refresh-older-than 72h (re-fetch records older than 3 days)
#       Runtime: ~2 hours
#       Purpose: catch new perfumes added to known brands
#
#   - WEEKLY (Sunday 02:00 UTC):
#       Source: --designers-index (ALL ~120 brands, ~5000 perfumes)
#       Mode:   --resume --refresh-older-than 168h (re-fetch records older than 7 days)
#       Runtime: ~6 hours
#       Purpose: discover new brands + full catalogue refresh
#
# PIPELINE:
#   1. Extract data from Fragrantica → data/fragrantica-extracted.json
#   2. Commit JSON to repo (always)
#   3. Upload to Supabase (only if SUPABASE_SERVICE_ROLE_KEY is configured)
#
# IMAGE EXTRACTION (strict, per spec):
#   Pattern 1 (PRIMARY): construct URL from product ID
#     https://fimgs.net/mdimg/perfume-thumbs/375x500.{product_id}.jpg
#   Pattern 2 (FALLBACK): parse HTML for <img itemprop="image">
#   Validation: only URLs matching the perfume-thumbs whitelist are accepted.
#   Rejected: brand logos, user Fragram gallery images, banner ads.
#
# CLOUDFLARE BYPASS:
#   Uses curl (not Node fetch) with browser-realistic headers + UA rotation.
#   5 retries with exponential backoff on 429/403/503.
#   4-8s random delay between requests.
#
# RESUME / DEDUP:
#   - data/fragrantica-progress.json tracks all processed URLs (committed to repo)
#   - data/fragrantica-extracted.json holds all records (committed to repo + uploaded to Supabase)
#   - Hourly runs skip already-processed URLs unless --refresh-older-than fires
#
# REQUIRED GITHUB SECRETS (configure in repo Settings → Secrets → Actions):
#   - SUPABASE_URL                — e.g. https://eixzihvihoammvremxrl.supabase.co
#   - SUPABASE_SERVICE_ROLE_KEY   — server-side service role key (NOT the anon key)
#
#   The anon/publishable key is already in js/config.js (safe to ship in browser).
#   The service_role key can WRITE to the database and must be kept secret.
#   Without these secrets, the Supabase upload step is skipped (data still goes to repo JSON).
name: Continuous Fragrantica sync

on:
  schedule:
    # Hourly: every hour at minute 0 (24/7)
    - cron: '0 * * * *'
    # Daily: 03:00 UTC (06:30 Asia/Tehran)
    - cron: '0 3 * * *'
    # Weekly: Sunday 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      source:
        description: 'Discovery source'
        required: true
        type: choice
        default: 'whats-new'
        options:
          - whats-new
          - brands
          - search
          - country
          - designers-index
      brands:
        description: 'Comma-separated brand slugs (when source=brands)'
        required: false
        default: 'Amouage,Dior,Chanel,Guerlain,Creed,Parfums-de-Marly,Frederic-Malle,Byredo'
      search_query:
        description: 'Search queries (when source=search). Format: "oud|male,rose|female"'
        required: false
        default: 'oud|male,rose|female,vanilla|unisex'
      countries:
        description: 'Countries (when source=country)'
        required: false
        default: 'France,Italy,USA'
      max_brands_from_index:
        description: 'Max brands (when source=designers-index, 0=all)'
        required: false
        default: '0'
      refresh_older_than:
        description: 'Hours: re-fetch records older than this (0=off, 168=1 week)'
        required: false
        default: '168'
      skip_supabase:
        description: 'Skip the Supabase upload step?'
        required: false
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'
      limit:
        description: 'Max perfumes to extract (0 = unlimited)'
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-fragrantica-sync.yml'
      - 'scripts/fragrantica-extract.mjs'
      - 'scripts/upload-fragrantica-to-supabase.mjs'
      - 'data/fragrantica-dictionary.mjs'

permissions:
  contents: write   # needed for git-auto-commit-action

# Single concurrency group: only one run at a time. New runs cancel the old one.
# This prevents stuck pending runs from blocking future scheduled runs.
concurrency:
  group: fragrantica-sync
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    # Timeout depends on tier:
    #   - Hourly (whats-new, ~68 perfumes): ~10 min → 60 min timeout is plenty
    #   - Daily (8 brands, ~1600 perfumes): ~90 min → needs 180 min timeout
    #   - Weekly (all brands, ~5000 perfumes): ~6 hours → 480 min timeout
    # The timeout-minutes is set high enough for the worst case (weekly = 8 hours).
    # The hourly run will exit naturally in ~10 min so this doesn't waste resources.
    timeout-minutes: 480   # 8 hours max (only weekly runs need this; hourly finishes in ~10 min)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # Node.js 22 LTS (Node 20 was deprecated 2025-09-19)

      - name: Confirm curl is installed
        run: |
          curl --version | head -1
          echo "curl is required for Cloudflare bypass (Node fetch gets 403)"

      - name: Detect schedule tier (hourly / daily / weekly)
        id: tier
        run: |
          # GitHub doesn't expose which cron fired; we infer from current UTC time.
          HOUR=$(date -u +"%H")
          MIN=$(date -u +"%M")
          DOW=$(date -u +"%u")  # 1=Mon ... 7=Sun
          echo "Now (UTC): hour=$HOUR min=$MIN dow=$DOW"
          echo "Runner IP info:"
          curl -s --max-time 5 https://api.ipify.org || echo "(IP lookup failed)"
          echo ""

          # Sunday 02:00 UTC → weekly (designers-index)
          if [ "$DOW" = "7" ] && [ "$HOUR" = "2" ]; then
            echo "tier=weekly" >> $GITHUB_OUTPUT
            echo "Detected: WEEKLY run (Sunday 02:00 UTC)"
          # Daily 03:00 UTC → brands
          elif [ "$HOUR" = "3" ]; then
            echo "tier=daily" >> $GITHUB_OUTPUT
            echo "Detected: DAILY run (03:00 UTC)"
          # All other hours → hourly whats-new
          else
            echo "tier=hourly" >> $GITHUB_OUTPUT
            echo "Detected: HOURLY run ($HOUR:00 UTC)"
          fi

      - name: Build extractor command
        id: cmd
        run: |
          TIER="${{ steps.tier.outputs.tier }}"
          # Manual dispatch always wins over schedule
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIER="manual"
          fi
          echo "Tier: $TIER"

          # Common base command for all tiers
          # Delay 3-5s is enough with cookie-jar session; was 5-9s before
          BASE_DELAY_MIN=3000
          BASE_DELAY_MAX=5000
          CMD="node scripts/fragrantica-extract.mjs --delay-min $BASE_DELAY_MIN --delay-max $BASE_DELAY_MAX --resume"

          case "$TIER" in
            hourly)
              # Hourly: just whats-new, refresh stale (>7d) records
              CMD="$CMD --whats-new --refresh-older-than 168"
              ;;
            daily)
              # Daily: full brand refresh, refresh records older than 3 days
              BRANDS="Amouage,Dior,Chanel,Guerlain,Creed,Parfums-de-Marly,Frederic-Malle,Byredo"
              CMD="$CMD --brands $BRANDS --refresh-older-than 72"
              ;;
            weekly)
              # Weekly: full designers index, refresh records older than 7 days
              CMD="$CMD --designers-index --refresh-older-than 168"
              ;;
            manual)
              # Manual dispatch — use workflow_dispatch inputs
              SOURCE="${{ github.event.inputs.source || 'whats-new' }}"
              BRANDS="${{ github.event.inputs.brands || 'Amouage,Dior,Chanel,Guerlain,Creed,Parfums-de-Marly,Frederic-Malle,Byredo' }}"
              SEARCH="${{ github.event.inputs.search_query || '' }}"
              COUNTRIES="${{ github.event.inputs.countries || '' }}"
              MAX_BRANDS="${{ github.event.inputs.max_brands_from_index || '0' }}"
              REFRESH="${{ github.event.inputs.refresh_older_than || '168' }}"
              LIMIT="${{ github.event.inputs.limit || '0' }}"
              CMD="$CMD --refresh-older-than $REFRESH --limit $LIMIT"
              case "$SOURCE" in
                brands)         CMD="$CMD --brands $BRANDS" ;;
                whats-new)      CMD="$CMD --whats-new" ;;
                search)         CMD="$CMD --search $SEARCH" ;;
                country)        CMD="$CMD --country $COUNTRIES" ;;
                designers-index) CMD="$CMD --designers-index --max-brands-from-index $MAX_BRANDS" ;;
              esac
              ;;
          esac

          echo "command=$CMD" >> $GITHUB_OUTPUT
          echo "Will run: $CMD"

      - name: Run extractor
        run: ${{ steps.cmd.outputs.command }}

      - name: Show extraction summary
        run: |
          TIER="${{ steps.tier.outputs.tier }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TIER="manual"; fi
          echo "### Fragrantica sync — $TIER run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered at: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/fragrantica-extracted.json ]; then
            COUNT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/fragrantica-extracted.json","utf8")).length)')
            echo "Total records in DB: **$COUNT**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Count records by source pattern
            node -e '
              const d = JSON.parse(require("fs").readFileSync("data/fragrantica-extracted.json","utf8"));
              const bySource = {};
              for (const r of d) {
                const s = r.imageUrlSource || "unknown";
                bySource[s] = (bySource[s]||0) + 1;
              }
              console.log("Image URL source distribution:");
              console.log("```json");
              console.log(JSON.stringify(bySource, null, 2));
              console.log("```");
            ' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Latest 5 records added/refreshed:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e '
              const d=JSON.parse(require("fs").readFileSync("data/fragrantica-extracted.json","utf8"));
              const sorted = d.slice().sort((a,b) => (b.extractedAt||"").localeCompare(a.extractedAt||""));
              console.log(JSON.stringify(sorted.slice(0,5).map(r=>({brand:r.brand,name:r.name,year:r.year,rating:r.rating,extractedAt:r.extractedAt})),null,2));
            ' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/fragrantica-progress.json ]; then
            echo "Progress:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e 'const p=JSON.parse(require("fs").readFileSync("data/fragrantica-progress.json","utf8")); console.log(JSON.stringify({processed:p.processed.length,failed:p.failed.length},null,2))' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit JSON to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): ${{ steps.tier.outputs.tier }} Fragrantica sync — ${{ github.run_id }}'
          file_pattern: 'data/fragrantica-extracted.json data/fragrantica-progress.json'
          commit_user_name: 'fragrantica-bot'
          commit_user_email: 'fragrantica-bot@users.noreply.github.com'

      - name: Upload to Supabase (optional)
        if: ${{ github.event.inputs.skip_supabase != 'yes' }}
        continue-on-error: true   # don't fail the workflow if Supabase upload fails (data is already in repo)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=== Uploading fragrantica-extracted.json to Supabase ==="
          node scripts/upload-fragrantica-to-supabase.mjs || true
          echo "Supabase upload step completed (exit code ignored — see warning above for status)"

      - name: Clean up cache (don't commit HTML cache files)
        run: |
          rm -rf data/.frag-cache
          echo "Cache cleaned — HTML files not committed to repo"
